<style>
    th {
        padding: 10px;
        text-align: center;
        vertical-align: middle;
    }
    td {
        padding: 5px;
    }
    .head {
        background-color: rgba(143, 175, 68, 1);
    }
    .bg-grey {
        background-color: rgba(202, 218, 235, 1);
    }
    .nopadding {
        padding: 0 !important;
        margin: 2px !important;
    }
    table.dataTable thead {background-color:#eff1f3}
</style>

<div class="{{module_id_class}}">
    <div class="box box-primary">
        <div class="box-primary box">
            <div class="box box-primary pad">
                <div class="table table-modules">
                    <!-- Widget ID (each widget will need unique ID)-->
                    <div class="jarviswidget jarviswidget2 jarviswidget-color-blueDark" id="wid-id-1" data-widget-editbutton="false">
                        <header class="">
                            <span class="widget-icon"> <i class="fa fa-calendar"></i> </span>
                            <h2>Pengaturan Tahun</h2>
                        </header>

                        <!-- widget div-->
                        <div>
                            <!-- widget content -->
                            <div class="widget-body">
                                <table id="datatable_fixed_column" class="table table-striped table-bordered" width="100%">
                                    <thead class="kepala">
                                    <tr>
                                        <th data-class="expand">No</th>
                                        <th data-class="expand">Aksi</th>
                                        <th data-class="expand">Tahun</th>
                                        <th data-class="expand">Status Aktif</th>
                                    </tr>
                                    </thead>
                                    <tbody id="bodiku">
                                    </tbody>
                                </table>
                            </div>
                            <!-- end widget content -->
                        </div>
                        <!-- end widget div -->
                    </div>
                    <!-- end widget -->
                </div>
            </div>
        </div>
        <div class="overlay">
            <i class="fa fa-refresh fa-spin"></i>
        </div>
    </div>
</div>

<!-- Modal Form -->
<div id="myModal" class="modal fade" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">Form Data Tahun</h4>
            </div>
            <form class="form-horizontal" id="form_input">
                <input type="hidden" name="id_tahun">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="col-sm-3 control-label"><strong>Tahun</strong></label>
                        <div class="col-md-9">
                            <input type="number" class="form-control" name="tahun" placeholder="Misal: 2026" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label"><strong>Status Aktif</strong></label>
                        <div class="col-md-9">
                            <select class="form-control" name="aktif">
                                <option value="1">Aktif</option>
                                <option value="0">Tidak Aktif</option>
                            </select>
                        </div>
                    </div>
                </div>
            </form>
            <div class="modal-footer">
                <button type="button" class="btSimpan btn btn-primary">Simpan</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
            </div>
        </div>
    </div>
</div>
